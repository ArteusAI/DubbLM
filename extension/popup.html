<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 250px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      background-color: #09090b;
      color: #f4f4f5;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: #3b82f6;
      font-size: 16px;
      border-bottom: 1px solid #27272a;
      padding-bottom: 8px;
    }
    p {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.4;
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    #status {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 500;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>DubbLM Cookie Sync</h3>
  <p>Synchronize cookies directly to your DubbLM server for downloading restricted videos.</p>
  
  <button id="syncBtn">Sync Cookies Now</button>
  <div id="status"></div>

  <div id="connectionStatus" style="font-size: 11px; margin-top: 12px; text-align: center; color: #a1a1aa; border-top: 1px solid #27272a; padding-top: 10px;">
    Connection: <span id="statusIndicator" style="font-weight: bold; color: #fbbf24;">Checking...</span>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
