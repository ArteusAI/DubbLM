<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DubbLM Extension Options</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      background-color: #09090b;
      color: #f4f4f5;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: #3b82f6;
      font-size: 16px;
      border-bottom: 1px solid #27272a;
      padding-bottom: 8px;
    }
    p {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.4;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-top: 12px;
    }
    input {
      width: 100%;
      background-color: #18181b;
      border: 1px solid #27272a;
      color: #f4f4f5;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      margin-top: 4px;
      box-sizing: border-box;
    }
    input:focus {
      border-color: #3b82f6;
      outline: none;
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    #status {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 500;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>DubbLM Extension Settings</h3>
  <p>Configure the default DubbLM server URL and API key/Bearer token.</p>
  
  <label for="serverUrl">DubbLM Server URL</label>
  <input type="text" id="serverUrl" value="http://localhost:8000">
  
  <label for="apiToken">API Token (Bearer)</label>
  <input type="password" id="apiToken" placeholder="Enter Bearer token if required">
  
  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
