# Smart Dubbing Tool Configuration

watermark_path: logo.png

# Required parameters (input must be provided via CLI --input)
source_language: "en"  # Source video language code (e.g., 'en', 'ru', 'de')
target_language: "ru"  # Target dubbing language code (e.g., 'ru', 'en', 'fr')

# Debug options
debug_info: false  # Generate debug video with speaker labels and timing info
debug_diarize_only: false  # Stop after diarization/transcription and generate debug video
debug_tts: true  # Save rejected/silent attempts for TTS

start_time: 1073
duration: 180

# Audio/Video processing
whisper_model: "large-v3"  # Whisper model size: tiny, base, small, medium, large, large-v3
keep_background: false  # Preserve background music/sounds in output
no_cache: false  # Disable caching (slower but fresh processing)
remove_pauses: false  # Automatically shorten long silence periods
normalize_audio: true  # Normalize audio volume for consistent output
dubbed_volume: 1.0  # Gain multiplier for the translated track (e.g., 1.2 for +1.6 dB)
use_two_pass_encoding: true  # Use two-pass encoding for better video quality (slower but higher quality)

# Text-to-Speech settings
tts_system: "gemini"  # TTS engine: coqui, openai, gemini, f5_tts
tts_model: "gemini-2.5-pro-preview-tts"  # TTS model (for Gemini: gemini-2.5-pro-preview-tts or gemini-2.5-flash-preview-tts)
tts_fallback_model: "gemini-2.5-pro-preview-tts"  # Fallback TTS model if primary fails
tts_prompt_prefix: "Speak in Russian as an engaged tech podcast guest in a fast-paced interview, with natural conversational energy, clear articulation:"  # Global voice instruction prefix for all speakers

# Gemini TTS emotion enrichment (adds emotional markup tags to text)
enable_emotion_enrichment: false  # Enable emotion enrichment using LLM
emotion_enrichment_model: "gemini-2.5-pro"  # Model for emotion analysis and enrichment
emotion_enrichment_temperature: 0.7  # Temperature for emotion enrichment (0.0-2.0, higher=more creative)

# Parallel processing settings for TTS
max_workers: 4  # Number of parallel workers for segment synthesis (higher=faster but more API usage)

# Segment optimization settings
segments_optimization:
  post_diarization_merge_gap: 0.3  # Max gap (seconds) to merge adjacent segments from same speaker after diarization
  post_translation_merge_gap: 1.5  # Max gap (seconds) to merge adjacent segments from same speaker after translation (for TTS optimization)
  max_segment_chars: 1200  # Maximum characters per segment (longer segments will be split)
  max_segment_duration: 180  # Maximum segment duration in seconds
  min_segment_duration: 0.5  # Minimum segment duration in seconds (shorter segments filtered out)

# Transcription settings
transcription_system: "assemblyai"  # Speech-to-text: whisper, openai, whisperx, assemblyai

# Translation engine configuration
translator_type: "llm"  # Translation method: llm (AI-powered context-aware)
llm_provider: "gemini"  # AI provider: gemini, openrouter
llm_model_name: "gemini-2.5-pro"  # Specific model for translation
llm_temperature: 1.0  # Translation creativity (0.0=conservative, 2.0=creative)

# Translation refinement settings
refinement_llm_provider: "openrouter"  # AI provider for style refinement
refinement_model_name: "anthropic/claude-sonnet-4.5"  # Model for translation polishing
refinement_temperature: 1.0  # Refinement creativity level
refinement_persona: "ai_buddy"  # Speaking style: normal, science_popularizer, casual_manager, child, housewife, it_buddy, ai_buddy

# Subtitle generation
save_original_subtitles: true  # Generate .srt file with original language
save_translated_subtitles: true  # Generate .srt file with translated text

# Voice configuration
# voice_name: "charon"  # Single voice for all speakers (OpenAI/Gemini voices)
voice_auto_selection: true  # Auto-match voices to speakers based on audio characteristics

# Advanced audio processing
# Optional: Preserve original audio for specific time ranges
# keep_original_audio_ranges:
#     - "00:00:00-00:00:40"  # Format: HH:MM:SS-HH:MM:SS or MM:SS-MM:SS or SS-SS
#     - "00:01:18-00:01:30.500"
#     - "00:01:38-00:01:48"
#     - "00:03:49-00:04:35"
#    - "0:10:00-0:10:20"  # Keep original from 10min to 10min 20s
#    - "1:05-1:15"        # Keep original from 1min 5s to 1min 15s
#    - "30-45"            # Keep original from 30s to 45s

# Per-speaker voice mapping
#voice_name:
#  SPEAKER_A: "achird"
#  SPEAKER_B: "pulcherrima"      # Assign specific voice to speaker A

# Per-speaker voice style instructions
#voice_prompt:
#  SPEAKER_A: ""     # Voice characteristics for speaker 1
#  SPEAKER_B: "Read aloud with the energy of a coach and the vision of a leader:"
#  SPEAKER_C: "Read aloud in a warm and friendly tone:" # Voice characteristics for speaker 3

# Per-speaker TTS engine assignment
#tts_system_mapping:
#  SPEAKER_00: "openai"   # Use OpenAI TTS for speaker 00
#  SPEAKER_01: "gemini"   # Use Gemini TTS for speaker 01
#  SPEAKER_02: "gemini"   # Use Gemini TTS for speaker 02

# Wildcard TTS mapping (alternative approach)
#tts_system_mapping:
#  SPEAKER_00: "gemini"   # Specific assignment for speaker 00
#  "*": "openai"          # Default TTS for all other speakers

# Translation consistency dictionary
glossary:
  "AI": "ИИ"
  "Lex Fridman": "Алексей Федотов"
  "Linus Torvalds": "Линус Торвальдсов"
  "embedding": "эмбеддинг"
  "AGI": "ЭйДжиАй"
  "ASI": "ЭйСиАй"
  "GPU": "GPU"
  "mixture of experts": "группа экспертов"
  "dense model": "монолитная модель"
  "sparse model": "разряженная модель"
  "mental model": "понимание"
  "Andrej Karpathy": "Андрей Каррпатый"

pricing:
  transcription:
    assemblyai:
      per_min: 0.0025
    openai:
      per_min: 0.006
  translation:
    gemini:
      input_per_1m_tokens: 3.00
      output_per_1m_tokens: 6.00
    openrouter:
      models:
        anthropic/claude-sonnet-4.5:
          input_per_1m_tokens: 3.00
          output_per_1m_tokens: 15.00
  tts:
    gemini:
      models:
        gemini-2.5-flash-preview-tts:
          input_per_1m_tokens: 0.50
          output_per_1m_tokens: 10.00
        gemini-2.5-pro-preview-tts:
          input_per_1m_tokens: 1.00
          output_per_1m_tokens: 20.00
      per_audio_min: null
    openai:
      input_per_1m_tokens: 0.6
      output_per_1m_tokens: 12
      per_audio_min: null
