# Smart Dubbing Tool Configuration

watermark_path: logo.png

# Required parameters (input must be provided via CLI --input)
source_language: "en"  # Source video language code (e.g., 'en', 'ru', 'de')
target_language: "ru"  # Target dubbing language code (e.g., 'ru', 'en', 'fr')
default_preset: "hq"  # Default UI preset: fast, hq, ultra

# UI/API preset defaults (source of truth for preset values)
presets:
  fast:
    llm_provider: "gemini"
    llm_model_name: "gemini-flash-lite-latest"
    llm_temperature: 0.5
    tts_system: "openai"
    tts_model: "gpt-4o-mini-tts"
    tts_fallback_model: "gpt-4o-mini-tts"
    keep_background: false
    pause_removal: "disabled"
    video_quality_preset: "720p"
    voice_auto_selection: true
    enable_emotion_enrichment: false
    dubbed_volume: 1.0
    background_volume: 0.56
    use_two_pass_encoding: true
    max_workers: 4
  hq:
    llm_provider: "gemini"
    llm_model_name: "gemini-flash-latest"
    llm_temperature: 0.5
    refinement_llm_provider: "gemini"
    refinement_model_name: "gemini-2.5-pro"
    refinement_temperature: 1.0
    tts_system: "gemini"
    tts_style: "podcast"
    keep_background: false
    pause_removal: "disabled"
    video_quality_preset: "1080p"
    voice_auto_selection: true
    enable_emotion_enrichment: false
    dubbed_volume: 1.0
    background_volume: 0.56
    use_two_pass_encoding: true
    max_workers: 4
  ultra:
    llm_provider: "gemini"
    llm_model_name: "gemini-flash-latest"
    llm_temperature: 0.5
    refinement_llm_provider: "openrouter"
    refinement_model_name: "openai/gpt-5.4"
    refinement_temperature: 0.8
    enable_llm_editor: true
    editor_llm_provider: "openrouter"
    editor_model_name: "openai/gpt-5.4"
    editor_temperature: 1.0
    editor_reasoning_effort: "xhigh"
    tts_system: "gemini"
    tts_style: "podcast"
    keep_background: true
    pause_removal: "disabled"
    video_quality_preset: "original"
    video_minterpolate_threshold: 1.0
    voice_auto_selection: true
    enable_emotion_enrichment: true
    dubbed_volume: 1.0
    background_volume: 0.56
    use_two_pass_encoding: true
    max_workers: 4

# Debug options
debug_info: false  # Generate debug video with speaker labels and timing info
debug_diarize_only: false  # Stop after diarization/transcription and generate debug video
debug_tts: true  # Save rejected/silent attempts for TTS

#start_time: 4077
#duration: 300

# Audio/Video processing
whisper_model: "large-v3"  # Whisper model size: tiny, base, small, medium, large, large-v3
keep_background: true  # Preserve background music/sounds in output
no_cache: false  # Disable caching (slower but fresh processing)
remove_pauses: false  # Automatically shorten long silence periods
normalize_audio: true  # Normalize audio volume for consistent output
dubbed_volume: 1.0  # Gain multiplier for the translated track (e.g., 1.2 for +1.6 dB)
use_two_pass_encoding: true  # Use two-pass encoding for better video quality (slower but higher quality)
enable_emotion_analysis: false

# Text-to-Speech settings
# Default TTS model / fallback are owned by Python constants
# (DEFAULT_GEMINI_TTS_MODEL / DEFAULT_GEMINI_TTS_FALLBACK_MODEL in
# src/tts/gemini_tts_wrapper.py); override here only if you truly need to.
tts_system: "gemini"  # TTS engine: coqui, openai, gemini, f5_tts
tts_prompt_prefix: "Speak in Russian with natural conversational energy, clear articulation:"  # Global voice instruction prefix for all speakers

enable_emotion_enrichment: true
emotion_enrichment_model: gemini-2.5-pro
emotion_enrichment_temperature: 0.7

# Parallel processing settings for TTS
max_workers: 4  # Number of parallel workers for segment synthesis (higher=faster but more API usage)

# Segment optimization settings
segments_optimization:
  post_diarization_merge_gap: 0.3  # Max gap (seconds) to merge adjacent segments from same speaker after diarization
  post_translation_merge_gap: 3.5  # Max gap (seconds) to merge adjacent segments from same speaker after translation (for TTS optimization)
  max_segment_duration: 280  # Maximum segment duration in seconds
  min_segment_duration: 0.5  # Minimum segment duration in seconds (shorter segments filtered out)

# Transcription settings
transcription_system: "assemblyai"  # Speech-to-text: whisper, openai, whisperx, assemblyai
#speakers_expected: 2  # Expected number of speakers for diarization (optional, auto-detect if not specified)

# Translation engine configuration
translator_type: "llm"  # Translation method: llm (AI-powered context-aware)
llm_provider: "gemini"  # AI provider: gemini, openrouter
llm_model_name: "gemini-2.5-pro"  # Specific model for translation
llm_temperature: 1.0  # Translation creativity (0.0=conservative, 2.0=creative)

# Translation refinement settings
refinement_llm_provider: "openrouter"  # AI provider for style refinement
refinement_model_name: "anthropic/claude-sonnet-4.5"  # Model for translation polishing
refinement_temperature: 1.0  # Refinement creativity level
refinement_persona: "normal"  # Speaking style: normal, science_popularizer, casual_manager, child, housewife, it_buddy, ai_buddy

# Subtitle generation
save_original_subtitles: true  # Generate .srt file with original language
save_translated_subtitles: true  # Generate .srt file with translated text

# Voice configuration
# voice_name: "charon"  # Single voice for all speakers (OpenAI/Gemini voices)
voice_auto_selection: true  # Auto-match voices to speakers based on audio characteristics

# Advanced audio processing
# Optional: Preserve original audio for specific time ranges
# keep_original_audio_ranges:
#     - "00:00:00-00:00:40"  # Format: HH:MM:SS-HH:MM:SS or MM:SS-MM:SS or SS-SS
#     - "00:01:18-00:01:30.500"
#     - "00:01:38-00:01:48"
#     - "00:03:49-00:04:35"
#    - "0:10:00-0:10:20"  # Keep original from 10min to 10min 20s
#    - "1:05-1:15"        # Keep original from 1min 5s to 1min 15s
#    - "30-45"            # Keep original from 30s to 45s

